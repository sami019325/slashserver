<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCA Classes - Memory Game</title>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Tiro+Bangla:ital@0;1&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS v4 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --brand-green: #10B981;
            --brand-dark: #064E3B;
        }

        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
            scroll-behavior: smooth;
        }

        /* Perspective for 3D flip */
        .perspective-1000 {
            perspective: 1000px;
        }

        /* Essential flip styles */
        .transform-style-preserve-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            /* Safari */
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Hide scrollbar for game container but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        /* Card transition */
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        /* Fullscreen game-area overlay (modal-like) */
        .fullscreen-section {
            position: fixed !important;
            inset: 0 !important;
            z-index: 60 !important;
            padding: 1rem !important;
            background: rgba(0, 0, 0, 1) !important;
            overflow: auto !important;
        }

        /* The actual game-area content when modal'd */
        .fullscreen-section.game-modal {
            width: min(100vw) !important;
            height: min(100vh) !important;
            border-radius: 12px !important;
            box-shadow: 0 10px 40px rgba(2, 6, 23, 0.6) !important;
            overflow: hidden !important;
            background: linear-gradient(180deg, rgba(16, 185, 129, 1) 0%, rgba(16, 185, 129, 1) 100%) !important;
            margin: auto !important;
            display: flex !important;
            flex-direction: column !important;
        }

        .fullscreen-close-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 70;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.06);
            color: rgb(106, 78, 18);
            backdrop-filter: blur(4px);
            box-shadow: 0 6px 18px rgba(2, 6, 23, 0.4);
        }

        /* Intro block dynamic styling */
        #game-intro {
            transition: background-color 180ms ease, color 180ms ease, transform 180ms ease;
        }

        /* Emoji animation */
        @keyframes float-up {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-80vh) scale(1.5) rotate(45deg);
                opacity: 0;
            }
        }

        .animate-float-up {
            animation: float-up linear forwards;
        }
    </style>
</head>

<body class="flex justify-start lg:justify-center bg-amber-950 min-h-screen">
    <div class="w-full lg:w-[500px] bg-white relative pb-20 flex flex-col h-screen overflow-hidden">

        <!-- Top Board / Scoreboard -->
        <div id="top-board"
            class="relative bg-amber-700 bg-[url('https://www.transparenttextures.com/patterns/cork-board.png')] pt-6 pb-4 px-3 shadow-[0_15px_20px_-5px_rgba(0,0,0,0.5)] z-10 flex-shrink-0 border-b-[12px] border-x-[12px] border-amber-950 rounded-b-3xl overflow-hidden before:absolute before:inset-0 before:bg-black/10">

            <div class="relative flex justify-between items-center z-10">
                <!-- Player 1 Sticky Note -->
                <div id="player1-score-box"

                    </div>
                    <div

                    <span

                <!-- Player 2 Sticky Note -->
                <div id="player2-score-box"

                    <!-- Blue Pin -->
                    <div

                        <div class="w-1.5 h-1.5 bg-white/60 rounded-full absolute top-0.5 left-1"></div>

                    <span class="text-[11px] font-bold text-amber-900 tracking-wider">PLAYER 2</span>

        <!-- Game Grid Area (Scrollable) -->
        <div id="game-area"
            class="flex-grow flex flex-col w-full px-2 pt-2 pb-4 bg-green-50 z-0 relative overflow-hidden bg-[linear-gradient(180deg,rgba(16,185,129,0.8)_0%,rgba(16,185,129,0.1)_80%)]">
            <!-- Card Name Display (Arcade LED Marquee) -->
            <div
                class="bg-gray-950 rounded-md border-2 border-gray-800 p-1.5  mt-11 text-center min-h-[36px] flex items-center justify-between shadow-[inset_0_3px_10px_rgba(0,0,0,0.9),0_2px_6px_rgba(0,0,0,0.4)] mb-2 shrink-0 relative overflow-hidden">
                <!-- Scanlines for LED effect -->
                <div
                    class="absolute inset-0 bg-[linear-gradient(rgba(0,0,0,0.4)_50%,transparent_50%)] bg-[length:100%_3px] pointer-events-none">
                </div>

                <!-- Left decoration -->
                <div class="flex items-center gap-1 pl-2 z-10 opacity-80">
                    <div class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse shadow-[0_0_5px_rgba(239,68,68,0.8)]">

                </div>

                <p id="card-name-display"

                    Select a card to begin
                </p>

                <!-- Right decoration -->
                <div class="flex items-center gap-1 pr-2 z-10 opacity-80">
                    <div class="w-1.5 h-1.5 rounded-full bg-blue-500 shadow-[0_0_5px_rgba(59,130,246,0.8)]"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_5px_rgba(34,197,94,0.8)]"></div>
                </div>
            </div>

            <!-- Added min-h-0 to let flex children shrink, h-full to take remaining space -->
            <div id="game-grid"
                class="grid grid-cols-4 grid-rows-8 sm:grid-cols-6 sm:grid-rows-6 lg:grid-cols-8 lg:grid-rows-4 gap-1.5 sm:gap-2 h-full flex-grow min-h-0">
                <!-- Cards will be injected here by JS -->

            </div>
        </div>

        <!-- Fullscreen toggle button (replaces restart) -->
        <div class="absolute bottom-24 right-4 z-20">
            <button id="toggle-fullscreen-btn" onclick="toggleFullscreenSection()"
                class="bg-lime-600 hover:bg-lime-500 text-white w-12 h-12 rounded-full shadow-xl flex items-center justify-center transition-transform active:scale-95"
                aria-label="Toggle game section fullscreen">
                <i id="toggle-fullscreen-icon" class="fas fa-expand"></i>
            </button>
        </div>

        <!-- Navigation Bar -->
        <nav id="nav"
            class="fixed bottom-0 left-0 right-0 h-20 flex items-center justify-center z-50 px-4 mb-4 lg:left-auto lg:right-auto lg:w-[500px]">
            <div
                class="bg-lime-950/95 backdrop-blur-xl w-full h-full rounded-2xl border border-lime-800/50 shadow-2xl flex items-center justify-around px-2">
                <a href="./classes.html"
                    class="flex flex-col items-center justify-center text-lime-100 hover:text-white transition duration-300 group">
                    <div class="bg-lime-900/50 p-2 rounded-xl group-hover:bg-lime-800 transition duration-300 mb-1">
                        <img src="./resources/course.png" class="w-6 h-6 object-contain" alt="Classes">
                    </div>
                    <span class="text-[10px] uppercase tracking-wider font-semibold">Classes</span>

                <a href="./game.html"
                    class="flex flex-col items-center justify-center text-white transition duration-300 group">
                    <div class="bg-lime-700 p-2 rounded-xl shadow-lg shadow-lime-900/50 mb-1 transform -translate-y-1">
                        <img src="./resources/game.png" class="w-6 h-6 object-contain" alt="Game">
                    </div>
                    <span class="text-[10px] uppercase tracking-wider font-bold text-lime-400">Game</span>
                </a>

                <a href="./certificate.html"
                    class="flex flex-col items-center justify-center text-lime-100 hover:text-white transition duration-300 group">
                    <div class="bg-lime-900/50 p-2 rounded-xl group-hover:bg-lime-800 transition duration-300 mb-1">
                        <img src="./resources/certificate.png" class="w-6 h-6 object-contain" alt="Certificate">
                    </div>
                    <span class="text-[10px] uppercase tracking-wider font-semibold">Certificate</span>

            </div>

    <script>
        // Full list of menu beverages
        const allBeverages = [
            "ESPRESSO", "AMERICANO", "ESPRESSO MACCHIATO", "CARAMEL MACCHIATO", "SALTED CARAMEL MACCHIATO",
            "CAPPUCCINO", "CINNAMON CAPPUCCINO", "LATTE", "HAZELNUT LATTE", "BUTTERSCOTCH LATTE", "VANILLA LATTE",
            "CARAMEL LATTE", "SALTED CARAMEL LATTE", "SPANISH LATTE", "MOCHA", "WHITE MOCHA", "SALTED CARAMEL MOCHA", "HOT CHOCOLATE",
            "MOCHA FRAPPE", "MOCHA COOKIE CRUMBLE", "WHITE MOCHA FRAPPE", "CARAMEL RIBBON CRUSH", "JAVA CHIP FRAPPE",
            "VANILLA FRAPPE", "HEZELNUT FRAPPE", "ESPRESSO FRAPPE", "CARAMEL MACCHIATO FRAPPE",
            "VIRGIN PASSION MOHITO", "GUMMY BEER", "SURISE TAMPLE", "BLUE DRAGON", "LEMON MINT", "ORANGE OCEAN",
            "ICED AMERICANO", "ICED CAPPUCCINO", "ICED LATTE", "ICED HAZELNUT LATTE", "ICED VANILLA LATTE",
            "ICED BUTTERSCOTCH LATTE", "ICED CARAMEL LATTE", "ICED SALTED CARAMEL LATTE", "ICED MOCHA", "ICED WHITE MOCHA",
            "ICED CARAMEL MACCHIATO", "ICED SALTED CARAMEL MACCHIATO", "ICED SPANISH LATTE", "LEMON ICED TEA", "PASSION ICED TEA",
            "STRAWBERRY ICED TEA", "MIX BERRY ICED TEA",
            "CLASSIC BUBBLE TEA", "CHOCOLATE BUBBLE TEA", "CARAMEL BUBBLE TEA", "SALTED CARAMEL BUBBLE TEA", "HAZELNUT BUBBLE TEA",
            "VANILLA BUBBLE TEA", "BUTTERSCOTCH BUBBLE TEA", "STRAWBERRY BUBBLE TEA", "MIX BERRY BUBBLE TEA", "BLUEBERRY BUBBLE TEA",
            "COOKIES & CREAM", "OREO SHAKE", "FRUITY TOOTY", "STRAWBERRY PURE", "CHOCOLATE BLAST", "BLUEBERRY SMOOTHIE",
            "ORANGE JUICE",
            "HOT BREWED TEA", "MILK TEA"
        ];

        // Game State Variables
        let cardsContext = [];
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;

        let currentPlayer = 1; // 1 or 2
        let scoreP1 = 0;
        let scoreP2 = 0;

        // Utility: formats name for image URL (e.g. "ESPRESSO MACCHIATO" -> "espresso_macchiato")
        const formatImageName = (name) => {
            return name.toLowerCase().replace(/[ &]+/g, "_");
        };

        // Utility: randomly shuffle array
        const shuffle = (array) => {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        };

        const updateScoreBoard = () => {
            document.getElementById('player1-score').textContent = scoreP1;
            document.getElementById('player2-score').textContent = scoreP2;

            const p1Box = document.getElementById('player1-score-box');
            const p2Box = document.getElementById('player2-score-box');
            const turnIndicator = document.getElementById('turn-indicator');

            if (currentPlayer === 1) {
                p1Box.classList.remove('border-transparent', 'opacity-60');
                p1Box.classList.add('border-lime-400', 'opacity-100');

                p2Box.classList.remove('border-lime-400', 'opacity-100');
                p2Box.classList.add('border-transparent', 'opacity-60');

                turnIndicator.textContent = 'Player 1';
                turnIndicator.className = 'text-sm font-bold text-lime-400';
            } else {
                p2Box.classList.remove('border-transparent', 'opacity-60');
                p2Box.classList.add('border-lime-400', 'opacity-100');

                p1Box.classList.remove('border-lime-400', 'opacity-100');
                p1Box.classList.add('border-transparent', 'opacity-60');

                turnIndicator.textContent = 'Player 2';
                turnIndicator.className = 'text-sm font-bold text-amber-400';
            }
        };

        const switchTurn = () => {
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateScoreBoard();
            // also update intro highlight
            updateGameIntro();
        };

        const checkMatch = () => {
            const isMatch = firstCard.dataset.name === secondCard.dataset.name;

            if (isMatch) {
                // Keep cards flipped and increment score
                if (currentPlayer === 1) scoreP1++;
                else scoreP2++;

                updateScoreBoard();
                updateGameIntro();

                // Keep turn if match (standard rules), or could switch. We'll keep turn.
                // Reset card variables
                firstCard.removeEventListener('click', flipCard);
                secondCard.removeEventListener('click', flipCard);

                // Add a match glow effect
                firstCard.querySelector('.card-front').classList.add('border-4', 'border-lime-400');
                secondCard.querySelector('.card-front').classList.add('border-4', 'border-lime-400');

                celebrateMatch();

                resetBoard();
                checkWinCondition();
            } else {
                // If no match, freeze board, wait, flip back, switch turn
                lockBoard = true;
                setTimeout(() => {
                    firstCard.querySelector('.card-inner').classList.remove('rotate-y-180');
                    secondCard.querySelector('.card-inner').classList.remove('rotate-y-180');
                    firstCard.classList.remove('flipped');
                    secondCard.classList.remove('flipped');

                    switchTurn();
                    resetBoard();
                }, 1200);
            }
        };

        const resetBoard = () => {
            firstCard = null;
            secondCard = null;
            lockBoard = false;
        };

        const checkWinCondition = () => {
            if (scoreP1 + scoreP2 === 16) {
                setTimeout(() => {
                    let winnerHTML = '';
                    if (scoreP1 > scoreP2) {
                        winnerHTML = `<span class="text-lime-400">Player 1 Wins!</span>`;
                    } else if (scoreP2 > scoreP1) {
                        winnerHTML = `<span class="text-amber-400">Player 2 Wins!</span>`;
                    } else {
                        winnerHTML = `<span class="text-white">It's a Tie!</span>`;
                    }
                    document.getElementById('card-name-display').innerHTML = `Game Over! ${winnerHTML}`;
                }, 500);
            }
        };

        const setTopDisplayText = (text) => {
            const display = document.getElementById('card-name-display');
            display.textContent = text;

            // tiny pop animation
            display.classList.remove('scale-105');
            void display.offsetWidth; // trigger reflow
            display.classList.add('scale-105', 'transition-transform');
            setTimeout(() => display.classList.remove('scale-105'), 200);
        };

        const celebrateMatch = () => {
            const emojis = ['☕', '🫘', '😃', '🎉', '✨', '🍵', '🥳'];
            for (let i = 0; i < 15; i++) {
                const emoji = document.createElement('div');
                emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                emoji.className = 'fixed text-3xl z-[100] pointer-events-none animate-float-up';
                // Random starting position horizontally
                emoji.style.left = (Math.random() * 90 + 5) + 'vw';
                emoji.style.bottom = '-50px';
                // Random animation duration between 0.8s and 1.2s
                emoji.style.animationDuration = (0.8 + Math.random() * 0.4) + 's';

                document.body.appendChild(emoji);

                setTimeout(() => {
                    if (emoji && emoji.parentNode) {
                        emoji.parentNode.removeChild(emoji);
                    }
                }, 1200);
            }
        };

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            // Mark as flipped
            this.classList.add('flipped');
            // Execute CSS flip
            this.querySelector('.card-inner').classList.add('rotate-y-180');

            const cardName = this.dataset.name;
            setTopDisplayText(cardName);

            if (!firstCard) {
                firstCard = this;
                return;
            }

            secondCard = this;
            checkMatch();
        }

        const buildCardHTML = (name, imgPath) => {
            const card = document.createElement('div');
            // Changed from aspect-[3/4] to h-full to let grid handle sizing
            card.classList.add('relative', 'w-full', 'h-full', 'cursor-pointer', 'perspective-1000', 'card-container');
            card.dataset.name = name;

            card.innerHTML = `
                <div class="card-inner w-full h-full relative transform-style-preserve-3d shadow-md rounded-xl">
                    <!-- Back of Card (Shown initially) -->
                    <div class="card-back absolute w-full h-full backface-hidden bg-amber-800 rounded-xl border border-amber-900 flex items-center justify-center bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+CjxyZWN0IHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0ibm9uZSI+PC9yZWN0Pgo8Y2lyY2xlIGN4PSIxMCIgY3k9IjEwIiByPSIyIiBmaWxsPSJyZ2JhKDI1NSwyNTUsMjU1LDAuMSkiPjwvY2lyY2xlPgo8L3N2Zz4=')]">
                        <i class="fas fa-coffee text-xl text-amber-600/50"></i>
                    </div>
                    
                    <!-- Front of Card (Hidden initially, shown on flip) -->
                    <div class="card-front absolute w-full h-full backface-hidden rotate-y-180 bg-white rounded-xl border-2 border-lime-100 flex items-center justify-center overflow-hidden">
                        <!-- Fallback icon if image fails to load -->
                        <div class="absolute inset-0 flex items-center justify-center bg-gray-50 z-0">
                             <i class="fas fa-mug-hot text-gray-300 text-xl"></i>
                        </div>
                        <img src="${imgPath}" alt="${name}" class="w-full h-full object-contain p-1 z-10 relative" onerror="this.style.opacity='0'">
                    </div>
                </div>
            `;

            card.addEventListener('click', flipCard);
            return card;
        };

        const initGame = () => {
            // Reset state
            currentPlayer = 1;
            scoreP1 = 0;
            scoreP2 = 0;
            updateScoreBoard();
            setTopDisplayText('Select a card to begin');
            resetBoard();

            // 1. Pick 16 random items from allBeverages
            const shuffledBeverages = shuffle([...allBeverages]);
            const selected16 = shuffledBeverages.slice(0, 16);

            // 2. Duplicate to make pairs (32 cards total)
            const deck = [...selected16, ...selected16];

            // 3. Shuffle the deck
            const shuffledDeck = shuffle(deck);

            // 4. Render Grid
            const grid = document.getElementById('game-grid');
            grid.innerHTML = ''; // clear existing

            shuffledDeck.forEach((itemName) => {
                // Ensure image names use .png extension as per typical web assets, 
                // formatted with underscores
                const imgURL = {
                    "Aero Press": "https://i.ibb.co.com/bQJz2607/aero-press.png",
                    "Affogato": "https://i.ibb.co.com/QcQ01R23/french-press.png",
                    "AMERICANO": "https://i.ibb.co.com/y3fmx1r/americano.png",
                    "BLUE DRAGON": "https://i.ibb.co.com/sdHjdNRg/blue-dragon.png",
                    "BLUEBERRY BUBBLE TEA": "https://i.ibb.co.com/FLcybsDn/blueberry-bubble-tea.png",
                    "BLUEBERRY SMOOTHIE": "https://i.ibb.co.com/20M7L2vq/blueberry-smoothie.png",
                    "Bulletproof Coffee": "https://i.ibb.co.com/QcQ01R23/french-press.png",
                    "BUTTERSCOTCH BUBBLE TEA": "https://i.ibb.co.com/zTgNv6YZ/butterscotch-bubble-tea.png",

        // Run init on load
        document.addEventListener('DOMContentLoaded', initGame);

        // Fullscreen/modal toggle state
        let _prevScrollPos = 0;
        const toggleFullscreenSection = () => {
            const area = document.getElementById('game-area');
            const icon = document.getElementById('toggle-fullscreen-icon');
            if (!area) return;

            const entering = !area.classList.contains('fullscreen-section');

            if (entering) {
                // open modal: save inner scrollTop, lock body, add classes
                _prevScrollPos = area.scrollTop || 0;
                area.classList.add('fullscreen-section');
                area.classList.add('game-modal');
                // show close X button
                createCloseButton();
                icon.classList.remove('fa-expand');
                icon.classList.add('fa-compress');
                document.body.style.overflow = 'hidden';
            } else {
                // close modal
                area.classList.remove('fullscreen-section');
                area.classList.remove('game-modal');
                removeCloseButton();
                icon.classList.remove('fa-compress');
                icon.classList.add('fa-expand');
                document.body.style.overflow = '';
                // restore inner scroll
                area.scrollTop = _prevScrollPos;
            }
        };

        const createCloseButton = () => {
            if (document.getElementById('fullscreen-close-btn')) return;
            const btn = document.createElement('button');
            btn.id = 'fullscreen-close-btn';
            btn.className = 'fullscreen-close-btn';
            btn.title = 'Close';
            btn.innerHTML = '<i class="fas fa-times"></i>';
            btn.addEventListener('click', () => toggleFullscreenSection());
            document.body.appendChild(btn);
        };

        const removeCloseButton = () => {
            const btn = document.getElementById('fullscreen-close-btn');
            if (btn) btn.remove();
        };

        /* --- Dynamic intro/header block for the game grid --- */
        const createGameIntro = () => {
            const grid = document.getElementById('game-grid');
            if (!grid) return;

            // remove existing intro if present
            const existing = document.getElementById('game-intro');
            if (existing) existing.remove();

            // build intro element
            const intro = document.createElement('div');
            intro.id = 'game-intro';
            intro.className = 'w-full mb-2 shrink-0 bg-gray-900 border-4 rounded-xl p-2 relative overflow-hidden shadow-lg transition-all duration-300';
            intro.innerHTML = `
                <!-- Scanline effect -->
                <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.03)_50%,transparent_50%)] bg-[length:100%_4px] pointer-events-none z-10"></div>
                <!-- Animated Background -->
                <div class="absolute inset-0 bg-gradient-to-r from-red-900/30 via-gray-900 to-blue-900/30 z-0"></div>
                
                <div class="relative z-20 flex justify-between items-center px-2 sm:px-6">
                    <!-- Player 1 -->
                    <div class="flex flex-col items-center w-[35%]">
                        <span class="text-[10px] sm:text-xs text-red-400 uppercase tracking-[0.2em] font-black drop-shadow-[0_0_4px_rgba(220,38,38,0.8)]">Player One</span>
                        <div class="flex items-center gap-2 mt-1">
                            <i class="fas fa-gamepad text-red-500 animate-pulse text-[10px] sm:text-xs"></i>
                            <span id="intro-score-p1" class="text-2xl sm:text-3xl text-white font-mono font-black drop-shadow-[0_2px_4px_rgba(0,0,0,1)] transition-all duration-300">0</span>
                        </div>
                        <span id="intro-p1" class="hidden"></span>
                    </div>

                    <!-- VS Badge -->
                    <div class="w-[30%] flex justify-center items-center relative">
                        <div class="absolute inset-0 bg-yellow-500/20 blur-xl rounded-full"></div>
                        <div class="bg-gradient-to-br from-yellow-300 to-yellow-600 border-2 border-yellow-100 rounded-full w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center shadow-[0_0_15px_rgba(250,204,21,0.6)] transform -skew-x-12 z-30">
                            <span class="text-amber-950 font-black italic text-lg sm:text-xl transform skew-x-12 drop-shadow-sm">VS</span>
                        </div>
                    </div>

                    <!-- Player 2 -->
                    <div class="flex flex-col items-center w-[35%]">
                        <span class="text-[10px] sm:text-xs text-blue-400 uppercase tracking-[0.2em] font-black drop-shadow-[0_0_4px_rgba(37,99,235,0.8)]">Player Two</span>
                        <div class="flex items-center gap-2 mt-1">
                            <span id="intro-score-p2" class="text-2xl sm:text-3xl text-white font-mono font-black drop-shadow-[0_2px_4px_rgba(0,0,0,1)] transition-all duration-300">0</span>
                            <i class="fas fa-headset text-blue-500 animate-pulse text-[10px] sm:text-xs"></i>
                        </div>
                        <span id="intro-p2" class="hidden"></span>
                    </div>
                </div>
            `;

            // Insert before grid so it appears above cards without messing up grid rows
            grid.parentNode.insertBefore(intro, grid);

            // initial update to reflect current player
            updateGameIntro();
        };

        const updateGameIntro = () => {
            const p1 = document.getElementById('intro-p1');
            const p2 = document.getElementById('intro-p2');
            const s1 = document.getElementById('intro-score-p1');
            const s2 = document.getElementById('intro-score-p2');
            const intro = document.getElementById('game-intro');
            if (!p1 || !p2 || !s1 || !s2 || !intro) return;

            // update scores
            s1.textContent = scoreP1;
            s2.textContent = scoreP2;

            // highlight active player
            if (currentPlayer === 1) {
                intro.style.boxShadow = '0 0 25px rgba(220, 38, 38, 0.4)';
                intro.style.borderColor = '#7f1d1d'; // red-900
                s1.classList.add('text-yellow-400', 'scale-125');
                s1.classList.remove('text-white');
                s2.classList.remove('text-yellow-400', 'scale-125');
                s2.classList.add('text-white');
            } else {
                intro.style.boxShadow = '0 0 25px rgba(37, 99, 235, 0.4)';
                intro.style.borderColor = '#1e3a8a'; // blue-900
                s2.classList.add('text-yellow-400', 'scale-125');
                s2.classList.remove('text-white');
                s1.classList.remove('text-yellow-400', 'scale-125');
                s1.classList.add('text-white');
            }
        };

    </script>
